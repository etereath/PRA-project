<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · PRA 运营中心</title>
  <link rel="stylesheet" href="/static/app.css?v=7f">
</head>
<body class="login-body">
  <main class="login-card">
    <p class="eyebrow">PRA 运营中心</p>
    <h1>登录</h1>
    <p class="muted">使用运营账号进入今日、数据库、业务管理和系统。</p>
    <p class="error-message">$message</p>
    <form method="post" action="/login" class="stack">
      <input type="hidden" name="csrf_token" value="$csrf_token">
      <label>账号<input name="username" value="$username" autocomplete="username" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">登录</button>
    </form>
  </main>
</body>
</html>
