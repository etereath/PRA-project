name: Core CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-core:
    name: Windows Core
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PRA_ENV: test
      PYTHONUTF8: "1"
    steps:
      - name: Checkout clean source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Configure canonical Windows temporary directory
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install build and test tools
        run: >-
          python -m pip install --disable-pip-version-check
          "setuptools>=68" wheel build pytest "openpyxl>=3.1.5,<4"
          "tzdata>=2025.2"

      - name: Run complete Windows pytest gate
        run: python -m pytest -q tests

      - name: Recompute Task 12 sanitized evidence bindings
        run: python scripts/verify_task12_sanitized_evidence.py

      - name: Recompute Task 13 sanitized evidence bindings
        run: python scripts/verify_task13_sanitized_evidence.py

      - name: Recompute Task 13 single-SKU round-trip evidence
        run: python scripts/verify_task13_round_trip_evidence.py

      - name: Recompute Task 13 multi-item success evidence
        run: python scripts/verify_task13_multi_success_evidence.py

      - name: Recompute Task 13 serial UNKNOWN stop evidence
        run: python scripts/verify_task13_serial_unknown_evidence.py

      - name: Recompute Task 13 UNKNOWN to RECONCILE evidence
        run: python scripts/verify_task13_unknown_reconcile_evidence.py

      - name: Recompute Task 13 UNKNOWN to NOT_APPLIED evidence
        run: python scripts/verify_task13_unknown_not_applied_evidence.py

      - name: Recompute Task 13 ALREADY_APPLIED evidence
        run: python scripts/verify_task13_already_applied_evidence.py

      - name: Recompute Task 13 batch preflight zero-write evidence
        run: python scripts/verify_task13_preflight_zero_write_evidence.py

      - name: Verify Credential Manager provider mocks and redaction
        run: python -m pytest -q tests/test_shadowbot_credentials.py

      - name: Verify ShadowBot queue, login, lease, importer, and watchdog regressions
        run: >-
          python -m pytest -q
          tests/test_shadowbot_queue.py
          tests/test_shadowbot_recovery.py
          tests/test_shadowbot_login_state.py
          tests/test_shadowbot_login_workflow.py

      - name: Verify Windows paths, Chinese paths, and UTF-8 handling
        run: >-
          python -m pytest -q
          tests/test_web_security.py
          tests/test_workbook_repository.py
          tests/test_workflow.py

      - name: Clean previous build outputs
        shell: pwsh
        run: |
          $targets = @(
            (Join-Path $env:GITHUB_WORKSPACE "build"),
            (Join-Path $env:GITHUB_WORKSPACE "dist"),
            (Join-Path $env:GITHUB_WORKSPACE "pra_mvp.egg-info")
          )
          foreach ($target in $targets) {
            if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          }

      - name: Build wheel and sdist
        run: python -m build --no-isolation

      - name: Audit package allowlist and scan source for secrets
        run: >-
          python scripts/verify_packaging.py
          --scan-dir app
          --scan-dir shadowbot

      - name: Verify wheel in a repository-external virtual environment
        run: python scripts/verify_core_wheel_install.py --dist-dir dist

      - name: Verify ShadowBot host fixtures and failure exit codes
        run: python scripts/verify_windows_core_fixture.py

      - name: Run core system smoke with a temporary database
        run: python scripts/run_system_smoke_tests.py --temporary-db

      - name: Compile Windows runtime sources
        run: python -m compileall -q app shadowbot scripts

      - name: Confirm checkout remains clean
        shell: pwsh
        run: |
          $status = git status --porcelain --untracked-files=all
          if ($status) {
            $status
            throw "CI commands modified the checkout"
          }

      - name: Upload audited Windows build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-windows-py311-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  linux-core:
    name: Linux Core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRA_ENV: test
      PYTHONUTF8: "1"
    steps:
      - name: Checkout clean source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install build and test tools
        run: >-
          python -m pip install --disable-pip-version-check
          "setuptools>=68" wheel build pytest "openpyxl>=3.1.5,<4"

      - name: Clean previous build outputs
        run: rm -rf build dist pra_mvp.egg-info

      - name: Build wheel and sdist
        run: python -m build --no-isolation

      - name: Audit package allowlist and statically scan source for secrets
        run: >-
          python scripts/verify_packaging.py
          --scan-dir app
          --scan-dir shadowbot

      - name: Verify wheel in a repository-external virtual environment
        run: python scripts/verify_core_wheel_install.py --dist-dir dist

      - name: Run platform-independent pytest scope
        run: python scripts/run_linux_core_tests.py

      - name: Recompute Task 12 sanitized evidence bindings
        run: python scripts/verify_task12_sanitized_evidence.py

      - name: Recompute Task 13 sanitized evidence bindings
        run: python scripts/verify_task13_sanitized_evidence.py

      - name: Recompute Task 13 single-SKU round-trip evidence
        run: python scripts/verify_task13_round_trip_evidence.py

      - name: Recompute Task 13 multi-item success evidence
        run: python scripts/verify_task13_multi_success_evidence.py

      - name: Recompute Task 13 serial UNKNOWN stop evidence
        run: python scripts/verify_task13_serial_unknown_evidence.py

      - name: Recompute Task 13 UNKNOWN to RECONCILE evidence
        run: python scripts/verify_task13_unknown_reconcile_evidence.py

      - name: Recompute Task 13 UNKNOWN to NOT_APPLIED evidence
        run: python scripts/verify_task13_unknown_not_applied_evidence.py

      - name: Recompute Task 13 ALREADY_APPLIED evidence
        run: python scripts/verify_task13_already_applied_evidence.py

      - name: Recompute Task 13 batch preflight zero-write evidence
        run: python scripts/verify_task13_preflight_zero_write_evidence.py

      - name: Run core system smoke with a temporary database
        run: python scripts/run_system_smoke_tests.py --temporary-db

      - name: Compile core and shared scripts
        run: python -m compileall -q app scripts

      - name: Confirm checkout remains clean
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Upload audited Linux build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-linux-py311-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
